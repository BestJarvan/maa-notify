name: PR 审核

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: 检查与构建
    if: github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行 Python 测试
        run: |
          echo "开始运行 Python 测试……"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          echo "Python 测试通过。"

      - name: 代码语法检查
        run: |
          echo "检查 Python 语法……"
          python3 -m py_compile maa_notify.py tests/test_maa_notify.py
          echo "检查 Shell 语法……"
          for file in install.sh install_menuapp.sh uninstall.sh uninstall_menuapp.sh menuapp/build.sh menuapp/package.sh 安装.command; do
            bash -n "$file"
          done
          echo "检查 plist……"
          plutil -lint menuapp/Info.plist
          echo "检查 GitHub Actions YAML……"
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f) }' .github/workflows/*.yml
          echo "语法检查通过。"

      - name: 构建 zip 和 dmg
        run: |
          echo "开始构建 zip 和 dmg……"
          ./menuapp/package.sh
          echo "zip 和 dmg 构建完成。"

      - name: 校验构建产物
        run: |
          VERSION="$(cat VERSION)"
          test -f "dist/MaaNotify-$VERSION.zip"
          test -f "dist/MaaNotify-$VERSION.dmg"
          test -f "dist/MaaNotify-$VERSION.zip.sha256"
          test -f "dist/MaaNotify-$VERSION.dmg.sha256"
          hdiutil verify "dist/MaaNotify-$VERSION.dmg"
          echo "构建产物校验通过，版本：$VERSION"

      - name: 上传 PR 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MaaNotify-pr-${{ github.event.pull_request.number }}
          path: |
            dist/MaaNotify-*.zip
            dist/MaaNotify-*.dmg
            dist/MaaNotify-*.sha256
          if-no-files-found: error

  security:
    name: 安全扫描
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 敏感信息扫描
        run: |
          echo "扫描疑似密钥与私钥……"
          if git grep -nEI '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|https://open\.feishu\.cn/open-apis/bot/v2/hook/[0-9a-f-]{20,})' -- . ':!README.md' ':!tests/*'; then
            echo "::error::发现疑似密钥，请移除后再提交。"
            exit 1
          fi
          echo "未发现明显密钥。"

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v3

  approve:
    name: 自动审批
    needs: [verify, security]
    if: >-
      success() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: 创建标签
        run: |
          gh label create "机器人审核通过" --color 0E8A16 \
            --description "机器人完成语法、安全和构建检查" --force
          gh label create "需要修复" --color D93F0B \
            --description "自动检查未通过" --force

      - name: 审批 PR 并打标签
        run: |
          gh pr review "$PR_NUMBER" --approve --body \
            "机器人审核通过：语法检查、CodeQL 安全扫描、敏感信息扫描、Swift 构建、zip 与 dmg 打包、dmg 校验均成功。仍需至少 1 名管理员审批后才能合并。"
          gh pr edit "$PR_NUMBER" --add-label "机器人审核通过" --remove-label "需要修复" || true
          gh pr comment "$PR_NUMBER" --body \
            "✅ 机器人审核通过。仍需至少 1 名管理员审批后才能合并；合并后才会触发发布流程。"

  needs-fix:
    name: 标记未通过
    needs: [verify, security]
    if: >-
      failure() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: 创建标签
        run: |
          gh label create "需要修复" --color D93F0B \
            --description "自动检查未通过" --force || true

      - name: 标记 PR
        run: |
          gh pr edit "$PR_NUMBER" --add-label "需要修复" || true
          gh pr comment "$PR_NUMBER" --body \
            "❌ 自动检查未通过。请查看本次 Actions 日志，修复后重新推送即可再次触发审核。"
